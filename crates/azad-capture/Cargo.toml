[package]
name = "azad-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Device-level keyboard capture helper for Azad"
publish = false

[features]
default = []
# IOKit device capture, peer authentication and platform bindings for the helper binary.
helper = []

[[bin]]
name = "azad-capture"
path = "src/bin/azad_capture.rs"
required-features = ["helper"]
test = false
bench = false

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
