[package]
name = "azad-capture-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Disposable-VM fixtures for verifying azad-capture"
publish = false

[[bin]]
name = "fixture-keyboard"
path = "src/bin/fixture_keyboard.rs"
test = false

[[bin]]
name = "fixture-app"
path = "src/bin/fixture_app.rs"
test = false

[[bin]]
name = "fixture-owner"
path = "src/bin/fixture_owner.rs"
test = false

[dependencies]
azad-capture = { path = "..", features = ["helper"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
